name: mobile-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  ios-tests:
    runs-on: macos-15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Xcode & CoreSimulator
        run: |
          sudo xcode-select --reset
          sudo xcodebuild -license accept
          xcodebuild -runFirstLaunch
          # Warm up CoreSimulator — first simctl call can time out on a cold runner
          for i in 1 2 3; do xcrun simctl list devices && break || sleep 10; done

      - name: Install dependencies
        run: npm ci

      - name: Verify environment
        run: npx mobilewright doctor

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"   # block until fully booted
          sleep 5
          xcrun simctl list devices booted

      - name: Install mobilecli agent (per-device, required)
        run: |
          for i in 1 2 3 4 5; do
            npx mobilewright install && exit 0
            echo "attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Build & install demo app
        run: |
          npm run app:build
          npm run app:install

      - name: Run tests
        run: npx mobilewright test --reporter html,junit

      - name: Upload report & artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            mobilewright-report/
            test-results/
          retention-days: 14

      - name: Upload junit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/*.xml
          if-no-files-found: ignore
          retention-days: 14
